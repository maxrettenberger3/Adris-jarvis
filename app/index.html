<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adris Jarvis</title>
<meta name="theme-color" content="#2a1638">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  Startseite der App ("Lader"). Sie lädt die Version, die Adri angenommen hat (v/<nummer>/index.html).
  Neue Versionen bietet sie NUR beim Öffnen der App an – nie mitten in der Arbeit – mit einer Infoseite
  (was ist neu, Vorteile, Nachteile, was bleibt gleich). Adri entscheidet selbst. Ihre Daten (aj-…) bleiben immer.
-->
<style>
:root{--wall:#2a1638;--paper:#fff6e6;--ink:#2a1638;--pink:#ff4fa3;--mint:#3fe0c5;--sun:#ffd23f;--soft:#cdb8dc;--ok:#2fbf71}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--wall);color:var(--paper);font-family:Nunito,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px)}
#u{max-width:620px;margin:0 auto}
h1{font-family:"Bagel Fat One",Nunito,sans-serif;font-weight:400;font-size:30px;margin:6px 0 4px;color:var(--sun)}
.sub{color:var(--soft);margin:0 0 16px;font-size:16px}
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:16px 18px;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card h2{margin:0 0 8px;font-size:18px}
.card ul{margin:0;padding-left:20px}.card li{margin:4px 0;font-size:16px;line-height:1.4}
.plus h2{color:#178a52}.minus h2{color:#c2386f}.gleich h2{color:#5b3f8a}
.btns{display:grid;gap:10px;margin-top:18px}
button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:16px;padding:15px 16px;cursor:pointer;color:var(--ink)}
.b1{background:var(--mint)}.b2{background:var(--sun)}.b3{background:var(--soft)}.b4{background:transparent;color:var(--soft);text-decoration:underline}
.ver{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tag{font-size:13px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px;white-space:nowrap}
.klein{font-size:14px;color:#6d5a80;margin:6px 0 0}
.lade{display:grid;place-items:center;min-height:70vh;color:var(--soft);font-size:18px}
</style>
</head>
<body>
<div id="u"><div class="lade">Jarvis startet …</div></div>
<script>
(()=>{   // alles in einer Klammer, damit nichts mit der App kollidiert (die hat eigene Namen wie L)
const L={get(k,d){try{const v=localStorage.getItem("aj-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
         set(k,v){try{localStorage.setItem("aj-"+k,JSON.stringify(v))}catch(e){}},
         del(k){try{localStorage.removeItem("aj-"+k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const U=document.getElementById("u");

async function lade(v){
  let html="";
  for(const n of [v,1]){
    try{const r=await fetch("v/"+n+"/index.html");if(r.ok){html=await r.text();if(n!==v)L.set("version",n);break}}catch(e){}
  }
  if(!html){U.innerHTML='<div class="lade">Ich bin gerade offline und finde keine gespeicherte Version. Versuch es gleich nochmal.</div>';return}
  document.open();document.write(html);document.close();
}

function liste(titel,cls,punkte){
  return punkte&&punkte.length?`<div class="card ${cls}"><h2>${titel}</h2><ul>${punkte.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:"";
}

function zeigeUpdate(info,aktiv,neue){
  const n=neue[neue.length-1], sammle=k=>neue.flatMap(v=>v[k]||[]);
  U.innerHTML=`
    <h1>✨ Update für dich</h1>
    <p class="sub">${esc(n.von||"Max")} hat etwas Neues für deinen Jarvis. Lies kurz drüber – <b>du entscheidest</b>.
      Deine Daten, dein Parkplatz und dein Verlauf bleiben in jedem Fall.</p>
    <div class="card"><h2>${esc(n.titel)}</h2><p class="klein">Version ${n.v} · ${esc(n.datum||"")}${n.dauer?" · "+esc(n.dauer):""}</p></div>
    ${liste("🆕 Was neu ist","",sammle("neu"))}
    ${liste("👍 Vorteile für dich","plus",sammle("vorteile"))}
    ${liste("👎 Nachteile / worauf du achten solltest","minus",sammle("nachteile"))}
    ${liste("🔒 Was gleich bleibt","gleich",sammle("bleibt").length?sammle("bleibt"):["Deine Daten, dein Gedanken-Parkplatz, dein Verlauf und dein Schlüssel."])}
    <div class="btns">
      <button class="b1" id="naechstes">✅ Ja – beim nächsten Öffnen</button>
      <button class="b2" id="jetzt">🚀 Ja – jetzt gleich</button>
      <button class="b3" id="spaeter">⏳ Später entscheiden</button>
      <button class="b4" id="nein">Nein danke, dieses Update nicht</button>
    </div>
    <p class="sub" style="margin-top:14px">Du kannst jederzeit zurück: Zahnrad → „Updates &amp; Versionen“.</p>`;
  document.getElementById("naechstes").onclick=()=>{L.set("version-naechste",n.v);lade(aktiv)};
  document.getElementById("jetzt").onclick=()=>{L.set("version",n.v);L.del("version-naechste");lade(n.v)};
  document.getElementById("spaeter").onclick=()=>lade(aktiv);
  document.getElementById("nein").onclick=()=>{L.set("update-nein",[...new Set([...L.get("update-nein",[]),...neue.map(v=>v.v)])]);lade(aktiv)};
}

function zeigeVersionen(info,aktiv){
  const vs=[...info.versionen].sort((a,b)=>b.v-a.v);
  U.innerHTML=`<h1>🔄 Versionen</h1>
    <p class="sub">Hier siehst du alle Versionen von deinem Jarvis und kannst wechseln – auch zurück.
      Deine Daten bleiben bei jedem Wechsel.</p>
    ${vs.map(v=>`<div class="card"><div class="ver"><h2 style="margin:0">${esc(v.titel)}</h2>${v.v===aktiv?'<span class="tag">aktiv</span>':""}</div>
      <p class="klein">Version ${v.v} · ${esc(v.datum||"")}</p>
      ${(v.neu||[]).length?`<ul style="margin-top:8px">${v.neu.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${v.v!==aktiv?`<div class="btns"><button class="b3" data-v="${v.v}">Diese Version nutzen</button></div>`:""}</div>`).join("")}
    <div class="btns"><button class="b1" id="zurueck">Zurück zu Jarvis</button></div>`;
  U.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;L.set("version",v);L.del("version-naechste");
    // bewusst zurückgegangen: neuere Versionen nicht bei jedem Öffnen wieder anbieten (hier kann sie jederzeit wechseln)
    L.set("update-nein",[...new Set([...L.get("update-nein",[]),...info.versionen.filter(x=>x.v>v).map(x=>x.v)])]);
    location.replace("./")});
  document.getElementById("zurueck").onclick=()=>location.replace("./");
}

(async function start(){
  if(L.get("version",null)==null)L.set("version",1);
  const naechste=L.get("version-naechste",null);         // angenommenes Update: wird JETZT, beim Öffnen, aktiv
  if(naechste){L.set("version",naechste);L.del("version-naechste")}
  const aktiv=L.get("version",1);
  let info=null;
  try{const r=await fetch("updates.json",{cache:"no-store"});if(r.ok)info=await r.json()}catch(e){}
  if(info&&location.search.includes("versionen"))return zeigeVersionen(info,aktiv);
  if(info){
    const nein=L.get("update-nein",[]);
    const neue=info.versionen.filter(v=>v.v>aktiv&&!nein.includes(v.v)).sort((a,b)=>a.v-b.v);
    if(neue.length)return zeigeUpdate(info,aktiv,neue);
  }
  lade(aktiv);
})();
})();
</script>
</body>
</html>
